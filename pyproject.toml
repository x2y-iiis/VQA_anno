[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vqa-annotation-pipeline"
version = "0.3.0"
description = "Resumable Subtask, ECoT, GRD, STA, and CPA video annotation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10",
  "openai>=2.1,<3",
  "requests>=2.31,<3",
  "httpx[socks]>=0.28,<1",
  "pyarrow>=15",
  "boto3>=1.34",
]

[tool.setuptools]
py-modules = []
